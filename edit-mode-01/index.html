<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>実験ページ｜編集モードの実験</title>
<style>
  :root { --main:#a44a2a; --accent:#31594f; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: sans-serif; color:#2b2b2b; background:#faf6f1; line-height:1.7; }
  .exp-band { background:#c0392b; color:#fff; text-align:center; font-weight:700; padding:8px 12px; font-size:14px; }
  header.site { background:var(--main); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
  header.site .name { font-size:20px; font-weight:700; }
  header.site .dummy { font-size:12px; background:#fff; color:#c0392b; border-radius:999px; padding:2px 10px; font-weight:700; }
  .hero { padding:28px 20px; text-align:center; }
  .hero img { width:100%; max-width:720px; border-radius:16px; display:block; margin:0 auto 18px; }
  .hero h1 { color:var(--main); margin:0 0 8px; font-size:30px; }
  .hero p { margin:0; }
  section { max-width:760px; margin:0 auto; padding:20px; }
  h2 { color:var(--accent); border-left:6px solid var(--accent); padding-left:10px; font-size:22px; }
  .menu-item { display:flex; justify-content:space-between; background:#fff; border:1px solid #e5ddd3; border-radius:10px; padding:10px 14px; margin-bottom:8px; }
  .about img { width:100%; border-radius:16px; display:block; margin-bottom:14px; }
  footer { background:var(--accent); color:#fff; text-align:center; padding:16px; margin-top:24px; }
  #editBar { position:fixed; left:0; right:0; top:0; background:#222; color:#fff; padding:10px 12px; display:none; z-index:50; box-shadow:0 2px 8px rgba(0,0,0,.35); }
  #editBar.open { display:block; }
  #editBar .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; max-width:900px; margin:0 auto 8px; }
  #editBar label { font-size:13px; }
  #editBar input[type="text"] { width:230px; padding:4px 6px; }
  #editBtn, #editBar button { background:var(--main); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:14px; }
  #editBtn { position:fixed; right:14px; bottom:14px; z-index:40; background:#444; }
  body.editing [data-text] { outline:2px dashed #c0392b; outline-offset:2px; }
  body.editing img.editable-img { outline:3px dashed #31594f; outline-offset:3px; cursor:pointer; }
  .mk { background:linear-gradient(transparent 55%, #ffd94d 55%); padding:0 2px; }
  #imgPicker { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:60; align-items:center; justify-content:center; }
  #imgPicker.open { display:flex; }
  #imgPicker .box { background:#fff; border-radius:14px; padding:16px; max-width:92vw; width:420px; }
  #imgPicker .opts { display:flex; gap:8px; }
  #imgPicker .opts img { width:32%; border-radius:8px; cursor:pointer; border:3px solid transparent; }
  #imgPicker input[type="text"] { width:100%; padding:6px; margin-top:10px; }
  #imgPicker .row { display:flex; gap:10px; margin-top:12px; }
  #imgPicker button { background:var(--main); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; }
  #editStatus { font-size:13px; }
</style>
</head>
<body>
<div class="exp-band">これは実験ページです。実在のお店ではありません（編集モードの実験）</div>
<header class="site">
  <div class="name" data-text="shopName">実験ベーカリー まるみ</div>
  <div class="dummy">ダミー店舗</div>
</header>

<div class="hero">
  <img id="imgHero" class="editable-img" data-img="hero" alt="ダミー画像（ヒーロー）">
  <h1 data-text="heroTitle">実験ページです</h1>
  <p data-text="heroSub"></p>
</div>

<section>
  <h2 data-text="noticeTitle"></h2>
  <p data-text="noticeText"></p>
</section>

<section>
  <h2>メニュー（ダミー）</h2>
  <div class="menu-item"><span data-text="menu1Name"></span><span data-text="menu1Price"></span></div>
  <div class="menu-item"><span data-text="menu2Name"></span><span data-text="menu2Price"></span></div>
  <div class="menu-item"><span data-text="menu3Name"></span><span data-text="menu3Price"></span></div>
</section>

<section class="about">
  <h2 data-text="aboutTitle"></h2>
  <img id="imgAbout" class="editable-img" data-img="about" alt="ダミー画像（お店の様子）">
  <p data-text="aboutText"></p>
</section>

<footer><span data-text="footerText"></span></footer>

<button id="editBtn" type="button">編集モード</button>

<div id="editBar">
  <div class="row">
    <label>メイン色 <input type="color" id="colorMain"></label>
    <label>アクセント色 <input type="color" id="colorAccent"></label>
    <span id="editStatus">文字はクリックで書き換え、画像はタップで変更</span>
  </div>
  <div class="row">
    <span id="selName">文字をタップすると、寄せとマーカーがここでできます</span>
    <button type="button" class="alignBtn" data-align="left">左</button>
    <button type="button" class="alignBtn" data-align="center">中央</button>
    <button type="button" class="alignBtn" data-align="right">右</button>
    <button type="button" id="markBtn">マーカー</button>
    <button type="button" id="unmarkBtn">強調を外す</button>
  </div>
  <div class="row">
    <button type="button" id="saveBtn">保存する</button>
    <button type="button" id="exitBtn">編集を終わる</button>
  </div>
</div>

<div id="imgPicker">
  <div class="box">
    <div style="font-weight:700; margin-bottom:8px;">画像を選んでください（実験用ダミー）</div>
    <div class="opts">
      <img data-preset="preset1" alt="ダミー1">
      <img data-preset="preset2" alt="ダミー2">
      <img data-preset="preset3" alt="ダミー3">
    </div>
    <input type="text" id="pickerUrl" placeholder="または画像URLを貼る">
    <div class="row">
      <button type="button" id="pickerApply">このURLを使う</button>
      <button type="button" id="pickerFile">ファイルから選ぶ</button>
      <button type="button" id="pickerCancel">やめる</button>
    </div>
    <input type="file" id="pickerFileInput" accept="image/*" style="display:none;">
  </div>
</div>

<script src="content.js"></script>
<script>
let content = null;
let editing = false;
let selectedKey = null;
function escapeHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* 保存用：許可するのは <br> と <span class="mk">（マーカー）だけ。それ以外は剥がす */
function sanitizeHtml(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html || '';
  const clean = (node) => {
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 3) return;
      if (ch.nodeType !== 1) { ch.remove(); return; }
      clean(ch);
      const tag = ch.tagName;
      if (tag === 'BR') { ch.removeAttribute('class'); return; }
      if (tag === 'SPAN' && ch.classList.contains('mk')) {
        ch.className = 'mk';
        [...ch.attributes].forEach(at => { if (at.name !== 'class') ch.removeAttribute(at.name); });
        return;
      }
      if (tag === 'DIV' || tag === 'P') {
        const br = document.createElement('br');
        ch.after(br);
        ch.replaceWith(...ch.childNodes);
        return;
      }
      ch.replaceWith(...ch.childNodes);
    });
  };
  clean(tpl.content);
  return tpl.innerHTML.replace(/^(<br\s*\/?>)+/, '').replace(/(<br\s*\/?>)+$/, '').trim();
}
/* 描画用：タグ入り（マーカー等）はサニタイズして出し、素の文章はエスケープ＋改行変換 */
function renderRich(text) {
  const t = text || '';
  if (/<[a-z][^>]*>/i.test(t)) return sanitizeHtml(t);
  return escapeHtml(t).replace(/\n/g, '<br>');
}

function applyContent() {
  document.documentElement.style.setProperty('--main', content.colors.main);
  document.documentElement.style.setProperty('--accent', content.colors.accent);
  document.querySelectorAll('[data-text]').forEach(el => {
    el.innerHTML = renderRich(content.texts[el.dataset.text]);
    el.style.textAlign = content.align[el.dataset.text] || '';
  });
  document.getElementById('imgHero').src = imageSrc(content.images.hero);
  document.getElementById('imgAbout').src = imageSrc(content.images.about);
}

function setImageControls() {
  document.getElementById('colorMain').value = content.colors.main;
  document.getElementById('colorAccent').value = content.colors.accent;
}

document.getElementById('editBtn').addEventListener('click', () => {
  const pw = prompt('編集モードの合言葉を入れてください（実験用：jikken）');
  if (pw !== EXPERIMENT_PASSCODE) { if (pw !== null) alert('合言葉が違います'); return; }
  editing = true;
  document.body.classList.add('editing');
  document.querySelectorAll('[data-text]').forEach(el => { el.innerHTML = renderRich(content.texts[el.dataset.text]); });
  document.querySelectorAll('[data-text]').forEach(el => el.contentEditable = 'true');
  setImageControls();
  const bar = document.getElementById('editBar');
  bar.classList.add('open');
  document.body.style.paddingTop = bar.offsetHeight + 'px';
  document.getElementById('editBtn').style.display = 'none';
});
document.getElementById('exitBtn').addEventListener('click', () => {
  editing = false;
  document.body.classList.remove('editing');
  document.querySelectorAll('[data-text]').forEach(el => el.contentEditable = 'false');
  storedRange = null;
  document.getElementById('editBar').classList.remove('open');
  document.body.style.paddingTop = '';
  document.getElementById('editBtn').style.display = '';
  applyContent();
});
let pickerTarget = null;
document.querySelectorAll('#imgPicker .opts img').forEach(im => {
  im.src = PRESET_IMAGES[im.dataset.preset]();
});
document.querySelectorAll('img.editable-img').forEach(im => {
  im.addEventListener('click', () => {
    if (!editing) return;
    pickerTarget = im.dataset.img;
    document.getElementById('pickerUrl').value = '';
    document.getElementById('imgPicker').classList.add('open');
  });
});
document.querySelectorAll('#imgPicker .opts img').forEach(im => {
  im.addEventListener('click', () => {
    if (!pickerTarget) return;
    content.images[pickerTarget] = im.dataset.preset;
    document.getElementById(pickerTarget === 'hero' ? 'imgHero' : 'imgAbout').src = imageSrc(im.dataset.preset);
    setImageControls();
    document.getElementById('imgPicker').classList.remove('open');
  });
});
document.getElementById('pickerApply').addEventListener('click', () => {
  const url = document.getElementById('pickerUrl').value.trim();
  if (!pickerTarget || !url) return;
  content.images[pickerTarget] = url;
  document.getElementById(pickerTarget === 'hero' ? 'imgHero' : 'imgAbout').src = url;
  setImageControls();
  document.getElementById('imgPicker').classList.remove('open');
});
document.getElementById('pickerCancel').addEventListener('click', () => {
  document.getElementById('imgPicker').classList.remove('open');
});
document.getElementById('pickerFile').addEventListener('click', () => {
  document.getElementById('pickerFileInput').click();
});
document.getElementById('pickerFileInput').addEventListener('change', async (ev) => {
  const f = ev.target.files[0];
  if (!f || !pickerTarget) return;
  let uri = await fileToDataUri(f);
  try { uri = await storeImage(uri); } catch (e) { /* 接続前は端末内保存のまま */ }
  content.images[pickerTarget] = uri;
  document.getElementById(pickerTarget === 'hero' ? 'imgHero' : 'imgAbout').src = uri;
  setImageControls();
  document.getElementById('imgPicker').classList.remove('open');
  ev.target.value = '';
});
['colorMain', 'colorAccent'].forEach(id =>
  document.getElementById(id).addEventListener('input', () => {
    document.documentElement.style.setProperty('--main', document.getElementById('colorMain').value);
    document.documentElement.style.setProperty('--accent', document.getElementById('colorAccent').value);
  }));

let storedRange = null;
document.addEventListener('selectionchange', () => {
  if (!editing) return;
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0);
  const host = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
  const wrap = host && host.closest ? host.closest('[data-text]') : null;
  if (wrap) storedRange = { key: wrap.dataset.text, range: r.cloneRange() };
});
document.querySelectorAll('[data-text]').forEach(el => {
  el.addEventListener('click', () => {
    if (!editing) return;
    selectedKey = el.dataset.text;
    document.getElementById('selName').textContent = '選択中：' + (TEXT_LABELS[selectedKey] || selectedKey);
  });
});
document.querySelectorAll('.alignBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!selectedKey) { document.getElementById('editStatus').textContent = '先に文字をタップして選んでください'; return; }
    content.align[selectedKey] = btn.dataset.align;
    const el = document.querySelector('[data-text="' + selectedKey + '"]');
    if (el) el.style.textAlign = btn.dataset.align;
  });
});
document.getElementById('markBtn').addEventListener('click', () => {
  let range = null, key = selectedKey;
  const sel = window.getSelection();
  if (sel.rangeCount && !sel.isCollapsed) {
    const r = sel.getRangeAt(0);
    const host = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
    const wrap = host && host.closest ? host.closest('[data-text]') : null;
    if (wrap) { range = r; key = wrap.dataset.text; }
  }
  if (!range && storedRange) { range = storedRange.range; key = storedRange.key; }
  if (!range) {
    document.getElementById('editStatus').textContent = '先に、目立たせたい文字をなぞって選んでください';
    return;
  }
  selectedKey = key;
  const span = document.createElement('span');
  span.className = 'mk';
  try { range.surroundContents(span); }
  catch (e) { span.appendChild(range.extractContents()); range.insertNode(span); }
  window.getSelection().removeAllRanges();
  storedRange = null;
});
document.getElementById('unmarkBtn').addEventListener('click', () => {
  if (!selectedKey) return;
  const el = document.querySelector('[data-text="' + selectedKey + '"]');
  if (!el) return;
  el.querySelectorAll('span.mk').forEach(sp => sp.replaceWith(...sp.childNodes));
});
document.getElementById('saveBtn').addEventListener('click', async () => {
  document.querySelectorAll('[data-text]').forEach(el => {
    content.texts[el.dataset.text] = sanitizeHtml(el.innerHTML);
  });
  content.colors.main = document.getElementById('colorMain').value;
  content.colors.accent = document.getElementById('colorAccent').value;
  const st = document.getElementById('editStatus');
  st.textContent = '保存しています…';
  try {
    const where = await saveContent(content);
    st.textContent = where === 'gas' ? '保存しました（シートに保存）' : '保存しました（このブラウザに保存：GAS未接続の実験状態）';
  } catch (e) {
    st.textContent = '保存に失敗しました：' + e.message;
  }
});

(async () => { content = await loadContent(); applyContent(); })();
</script>
</body>
</html>
